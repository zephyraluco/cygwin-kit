name: Package

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Compile tagged sources
        run: ./scripts/build.ps1
      - name: Package Cygwin runtime
        run: ./scripts/package.ps1
      - name: Upload Cygwin archive
        uses: actions/upload-artifact@v4
        with:
          name: cygwin-x86_64
          path: ${{ runner.temp }}/cygwin-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
